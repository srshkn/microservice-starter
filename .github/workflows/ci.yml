name: CI

on:
  push:
    branches-ignore:
      - main
      - release
    paths-ignore:
      - README.md
      - LICENSE
      - .env.example
      - docs/**
      - .gitignore
      - .dockerignore
  
  pull_request:
    branches:
      - main
      - dev

jobs:
  checks-go:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.work
          cache: true
          cache-dependency-path: |
            **/go.sum

      - name: Check formatting
        shell: bash
        run: |
          files="$(gofmt -l .)"

          if [[ -n "$files" ]]; then
            echo "These files are not formatted:"
            echo "$files"
            exit 1
          fi

      - name: Vet
        run: | 
          go vet ./services/gateway/...

      - name: Test
        run: |
          go test ./services/gateway/...

      - name: Build
        run: | 
          go build ./services/gateway/...

  checks-dockerfile:
    needs: checks-go
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Validate Dockerfile
        run: docker build --check -f ./services/gateway/Dockerfile .

      - name: Build Docker image
        run: docker build -f ./services/gateway/Dockerfile -t gateway:ci .
